name: RWKV weight publisher CI

on:
  pull_request:
    paths:
      - ".github/workflows/rwkv-weight-publisher-ci.yml"
      - "temp/publish_rwkv7_weights.py"
      - "temp/rwkv_pth2st.py"
      - "tests/models/rwkv/test_rwkv_weight_publisher.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rwkv-weight-publisher-ci.yml"
      - "temp/publish_rwkv7_weights.py"
      - "temp/rwkv_pth2st.py"
      - "tests/models/rwkv/test_rwkv_weight_publisher.py"

permissions:
  contents: read

jobs:
  publisher-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . torch pytest ruff

      - name: Run publisher tests
        run: python -m pytest -q tests/models/rwkv/test_rwkv_weight_publisher.py

      - name: Check publisher style
        run: |
          ruff check temp/publish_rwkv7_weights.py tests/models/rwkv/test_rwkv_weight_publisher.py
          ruff format --check temp/publish_rwkv7_weights.py tests/models/rwkv/test_rwkv_weight_publisher.py
