name: PR CI Security Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: read
  pull-requests: write

jobs:
  security-gate:
    # Same-repository branches and trusted contributors trigger PR CI directly; this gate is only for external forks.
    if: >-
      github.event.pull_request.head.repo.full_name != github.repository &&
      !contains(fromJSON('["MEMBER","OWNER","COLLABORATOR"]'), github.event.pull_request.author_association)
    # Intentionally not passing `secrets: inherit` to avoid leaking secrets in runs triggered from forked repos
    uses: huggingface/transformers-ci/.github/workflows/pr-ci-security-gate.yml@main
