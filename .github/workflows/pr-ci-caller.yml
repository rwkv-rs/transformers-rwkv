name: PR CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
      - ci-*
      - v*-release

concurrency:
  # Group by PR number, commit SHA (main) to avoid cross-branch cancellation, or branch ref for cancellation within each branch
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rwkv7-cpu-contract:
    name: RWKV7 focused CPU contracts
    runs-on: ubuntu-24.04
    container:
      image: huggingface/transformers-torch-light
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Fix git safe directory
        run: git config --global --add safe.directory '*'

      - name: Install RWKV7 CPU test dependencies
        run: uv pip install -e .

      - name: Run RWKV7 CPU contracts
        run: |
          python -m pytest -v \
            tests/models/rwkv7/test_configuration_rwkv7.py \
            tests/models/rwkv7/test_conversion_rwkv7.py \
            tests/models/rwkv7/test_benchmark_rwkv7.py \
            tests/models/rwkv7/test_pretraining_rwkv7.py \
            tests/models/rwkv7/test_publication_rwkv7.py \
            tests/models/rwkv7/test_modeling_rwkv7.py::Rwkv7ModelTest::test_config \
            tests/models/rwkv7/test_modeling_rwkv7.py::Rwkv7ModelTest::test_model \
            tests/models/rwkv7/test_modeling_rwkv7.py::test_rwkv7_initializes_regular_linear_weights \
            tests/models/rwkv7/test_modeling_rwkv7.py::test_rwkv7_skips_packed_linear_without_weight \
            tests/models/rwkv7/test_modeling_rwkv7.py::test_rwkv7_quantized_low_rank_initialization_preserves_packed_weights_in_fresh_process \
            tests/models/rwkv7/test_modeling_rwkv7.py::test_rwkv7_causal_lm_forward_backward_and_recurrent_state \
            tests/models/rwkv7/test_modeling_rwkv7.py::test_rwkv7_github_repository_canonicalization_accepts_exact_repo \
            tests/models/rwkv7/test_modeling_rwkv7.py::test_rwkv7_github_repository_canonicalization_rejects_hostile_source \
            tests/models/rwkv7/test_modeling_rwkv7.py::test_rwkv7_vcs_direct_url_rejects_ascii_controls \
            tests/models/rwkv7/test_modeling_rwkv7.py::test_rwkv7_editable_provenance_accepts_lowercase_repository_without_git_suffix \
            tests/models/rwkv7/test_modeling_rwkv7.py::test_rwkv7_runtime_provenance_rejects_ascii_controls_in_fresh_process \
            tests/models/rwkv7/test_modeling_rwkv7.py::test_rwkv7_runtime_provenance_rejects_same_name_registry_package \
            tests/models/rwkv7/test_modeling_rwkv7.py::test_rwkv7_runtime_provenance_rejects_wrong_fork_revision \
            tests/models/rwkv7/test_modeling_rwkv7.py::test_rwkv7_runtime_provenance_rejects_unproven_flash_rwkv \
            tests/models/rwkv7/test_modeling_rwkv7.py::test_rwkv7_missing_public_fla_contract_fails_closed \
            tests/models/rwkv7/test_modeling_rwkv7.py::test_rwkv7_public_contract_does_not_fall_back_to_chunk \
            tests/models/rwkv7/test_modeling_rwkv7.py::test_rwkv7_public_contract_requires_fused_inference_surface \
            tests/models/rwkv7/test_modeling_rwkv7.py::test_rwkv7_reference_matches_explicit_dplr_oracle \
            tests/models/rwkv7/test_modeling_rwkv7.py::test_rwkv7_decay_logit_semantics_match_primary_source_forward_and_gradient \
            tests/models/rwkv7/test_modeling_rwkv7.py::test_rwkv7_product_decay_and_recurrence_match_independent_oracle_with_gradients \
            tests/models/rwkv7/test_modeling_rwkv7.py::test_rwkv7_public_recurrent_signature_is_importable_in_fresh_process \
            tests/models/rwkv7/test_modeling_rwkv7.py::test_rwkv7_public_recurrent_rejects_ambiguous_log_decay_signature \
            tests/models/rwkv7/test_modeling_rwkv7.py::test_rwkv7_public_contract_rejects_legacy_decay_exports \
            tests/models/rwkv7/test_modeling_rwkv7.py::test_rwkv7_monkeypatched_public_fla_contract_drives_two_layer_hf_calls \
            tests/models/rwkv7/test_modeling_rwkv7.py::test_rwkv7_eligible_inference_uses_public_fused_tmix_and_cmix_with_telemetry \
            tests/models/rwkv7/test_modeling_rwkv7.py::test_rwkv7_public_recurrent_packed_state_pool_is_updated_by_identity \
            tests/models/rwkv7/test_modeling_rwkv7.py::test_rwkv7_public_recurrent_passes_prevalidated_metadata_ticket_by_identity \
            tests/models/rwkv7/test_modeling_rwkv7.py::test_rwkv7_public_fla_contract_rejects_provider_fallback \
            tests/models/rwkv7/test_modeling_rwkv7.py::test_rwkv7_generate_updates_recurrent_state \
            tests/models/rwkv7/test_modeling_rwkv7.py::test_rwkv7_save_reload_and_auto_classes \
            tests/examples/test_any_to_rwkv_qwen3_5_conversion.py

  rwkv7-gpu-contract:
    name: RWKV7 PRO6000 operator E2E
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/rwkv7-decay-kernel-alignment'
    runs-on: [self-hosted, rwkv-sha-pro6000x8]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Preflight PRO6000 runner
        run: |
          nvidia-smi
          uv --version
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install canonical RWKV7 runtime in a fresh environment
        run: |
          uv venv "$RUNNER_TEMP/rwkv7-gpu-venv" --python 3.12 --clear
          uv pip install --python "$RUNNER_TEMP/rwkv7-gpu-venv/bin/python" -e '.[torch,rwkv7]' pytest pytest-xdist

      - name: Run real RWKV7 operator contracts
        run: |
          "$RUNNER_TEMP/rwkv7-gpu-venv/bin/python" -m pytest -v \
            --junitxml="$RUNNER_TEMP/rwkv7-gpu-junit.xml" \
            tests/models/rwkv7/test_modeling_rwkv7_gpu.py

      - name: Record canonical runtime provenance
        if: always()
        run: |
          "$RUNNER_TEMP/rwkv7-gpu-venv/bin/python" - <<'PY'
          import json
          import os
          from pathlib import Path

          import torch

          from transformers.models.rwkv7.modeling_rwkv7 import validate_rwkv7_runtime_provenance


          evidence = {
              "commit": os.environ["GITHUB_SHA"],
              "cuda": torch.version.cuda,
              "device": torch.cuda.get_device_name(0) if torch.cuda.is_available() else None,
              "provenance": validate_rwkv7_runtime_provenance(),
              "torch": torch.__version__,
          }
          output = Path(os.environ["RUNNER_TEMP"]) / "rwkv7-gpu-provenance.json"
          output.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(output.read_text(encoding="utf-8"))
          PY

      - name: Upload RWKV7 GPU evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: rwkv7-pro6000-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/rwkv7-gpu-junit.xml
            ${{ runner.temp }}/rwkv7-gpu-provenance.json
          if-no-files-found: error

  pr-ci:
    uses: ./.github/workflows/pr-ci_dynamic_caller_example.yml
    with:
      cpu_runner: ubuntu-24.04
      run_dynamic_test_matrix: false
